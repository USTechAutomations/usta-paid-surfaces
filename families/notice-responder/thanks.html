<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Notice Responder letter pack</title>
  <style>
    body { font: 16px/1.5 Georgia, serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #111; }
    .box { border: 2px solid #7a3b12; background: #fff6ee; padding: 0.8rem 1rem; margin: 1rem 0; }
    button { font: inherit; padding: 0.4rem 0.9rem; }
    pre { white-space: pre-wrap; background: #fafafa; padding: 1rem; border: 1px solid #ddd; }
    ul { padding-left: 1.2rem; }
    .no-print { margin: 1rem 0; }
    @media print {
      .no-print { display: none; }
      body { margin: 0; }
    }
  </style>
</head>
<body>
  <p class="box"><strong>This is document preparation, not tax advice.</strong> A tax agency is not required to accept this draft.</p>
  <h1>Letter pack</h1>
  <p id="status">Looking up your payment…</p>
  <div id="key-box" class="box" hidden>
    <p><strong>Your key</strong></p>
    <pre id="license-key"></pre>
    <p class="no-print"><button type="button" id="copy-btn">Copy</button></p>
  </div>
  <div class="no-print">
    <button type="button" id="print-btn">Print</button>
  </div>
  <article id="pack" hidden>
    <h2>Draft letter</h2>
    <pre id="letter"></pre>
    <h2>Checklist</h2>
    <ul id="checklist"></ul>
    <h2>Enclosures</h2>
    <ul id="enclosures"></ul>
  </article>
<!-- ENTITLEMENT_BASE: swap to the hosted address before buttons go live -->
<script>
var ENTITLEMENT_BASE = "https://usta-entitlements-jursznftva-uc.a.run.app";
    const FIT_API_URL = (window.FIT_API_URL || "http://127.0.0.1:8782").replace(/\/$/, "");
    const params = new URLSearchParams(location.search);
    (function applyLocalEnt() {
      var host = (location.hostname || "").toLowerCase();
      var local = location.protocol === "file:" || host === "127.0.0.1" || host === "localhost";
      if (local) {
        var ent = params.get("ent");
        if (ent) ENTITLEMENT_BASE = String(ent).replace(/\/$/, "");
      }
    })();
    const sessionId = params.get("session_id") || "";
    const noticeCode = params.get("code") || sessionStorage.getItem("nr_notice_code") || "CP2000";
    const status = document.getElementById("status");
    const keyEl = document.getElementById("license-key");
    const keyBox = document.getElementById("key-box");
    const copyBtn = document.getElementById("copy-btn");
    const POLL_MS = 5000;
    const MAX_MS = 3 * 60 * 1000;
    const FAIL_TEXT = "The key was not found yet. Reload this page later. We do not email the key.";
    document.getElementById("print-btn").addEventListener("click", () => window.print());
    if (copyBtn) {
      copyBtn.addEventListener("click", function () {
        var t = (keyEl && keyEl.textContent) || "";
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(t).then(function () {
            copyBtn.textContent = "Copied";
          }).catch(function () {
            copyBtn.textContent = "Copy";
          });
        }
      });
    }

    async function sha256Hex(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
    }

    async function installId() {
      const key = "nr_install_id";
      let hex = localStorage.getItem(key);
      if (hex && /^[0-9a-f]{64}$/.test(hex)) return hex;
      hex = await sha256Hex(crypto.randomUUID());
      localStorage.setItem(key, hex);
      return hex;
    }

    function showPack(result) {
      document.getElementById("letter").textContent = result.letter_text || "";
      const fill = (id, items) => {
        const ul = document.getElementById(id);
        ul.innerHTML = "";
        for (const item of items || []) {
          const li = document.createElement("li");
          li.textContent = item;
          ul.appendChild(li);
        }
      };
      fill("checklist", result.checklist);
      fill("enclosures", result.enclosures);
      document.getElementById("pack").hidden = false;
    }

    function facts() {
      try {
        return JSON.parse(sessionStorage.getItem("nr_facts") || "{}");
      } catch {
        return {};
      }
    }

    function sleep(ms) {
      return new Promise(function (resolve) { setTimeout(resolve, ms); });
    }

    async function waitForKey() {
      var started = Date.now();
      while (true) {
        try {
          const claimRes = await fetch(
            ENTITLEMENT_BASE.replace(/\/$/, "") + "/v1/claim?session_id=" + encodeURIComponent(sessionId),
          );
          if (claimRes.status === 404) return { fail: "unknown" };
          const claim = await claimRes.json();
          if (claim && claim.ok && claim.key) return { key: claim.key };
        } catch (err) {
          /* still processing */
        }
        if (Date.now() - started >= MAX_MS) return { fail: "timeout" };
        status.textContent = "Payment is still processing. Checking again…";
        await sleep(POLL_MS);
      }
    }

    async function main() {
      if (!sessionId) {
        status.textContent = "Missing session_id on this page. Pay first; the thank-you link includes it.";
        return;
      }
      const got = await waitForKey();
      if (!got.key) {
        status.textContent = FAIL_TEXT;
        return;
      }
      status.textContent = "Payment received";
      if (keyEl) keyEl.textContent = got.key;
      if (keyBox) keyBox.hidden = false;
      status.textContent = "Building the letter pack…";
      const fitRes = await fetch(`${FIT_API_URL}/v1/fit`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          product: "notice-responder",
          task: "notice_letter",
          install_id: await installId(),
          license_key: got.key,
          input: { notice_code: noticeCode, facts: facts() },
        }),
      });
      const fit = await fitRes.json();
      if (!fit.ok) {
        status.textContent = "The letter pack could not be built (" + (fit.reason || "error") + ").";
        return;
      }
      status.textContent = "Print this page. We do not email the pack.";
      showPack(fit.result || {});
    }

    main().catch((err) => {
      status.textContent = FAIL_TEXT;
    });
  </script>
</body>
</html>
