server {
  listen 8080;
  server_name _;
  # Paid buyer artifacts are private even if a stale file reaches an image.
  if ($uri ~ "^/[a-z][a-z0-9-]*/p/[0-9a-f]{20}(/|$)") { return 404; }
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  charset utf-8;
  # Every kind of file we actually serve has to be named here, because the
  # default_type below is text/html and X-Content-Type-Options: nosniff at the
  # bottom of this file forbids the browser from working it out for itself.
  # Until 2026-08-22 sample.csv and sample.json were both handed out labelled
  # "a web page": a person clicking the link got the rows painted into a
  # browser tab instead of saved, and a machine that asked what it had received
  # was told the wrong thing. A reply of 200 is not proof you got the file.
  types {
    text/html html;
    text/css css;
    application/javascript js mjs;
    application/xml xml;
    image/svg+xml svg;
    font/woff2 woff2;
    text/csv csv;
    application/json json;
    application/zip zip;
  }
  default_type text/html;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_comp_level 5;
  gzip_proxied any;
  gzip_types text/css text/xml application/xml application/json text/csv image/svg+xml;

  # /feeds/ttb -> ttb/index.html ; /feeds/styles.css -> styles.css ; /feeds -> index.html
  # Relative sample links need the product directory as their URL base.
  location = /frozen-custody { return 308 /feeds/frozen-custody/$is_args$args; }
  # Source-use holds: never expose retained sample copies.
  location = /hospital-mrf/sample.csv { return 404; }
  location = /hospital-mrf/sample.json { return 404; }
  location = /model-cards/sample.csv { return 404; }
  location = /model-cards/sample.json { return 404; }
  location / {
    try_files $uri/index.html $uri $uri.html =404;
  }

  location ~* \.(css|woff2|svg|png|jpg|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  error_page 404 /404.html;
  location = /404.html { internal; }

  add_header X-Content-Type-Options nosniff always;
}
