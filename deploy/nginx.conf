server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  charset utf-8;
  types { text/html html; text/css css; application/xml xml; image/svg+xml svg; font/woff2 woff2; }
  default_type text/html;

  # /feeds/ttb -> ttb/index.html ; /feeds/styles.css -> styles.css ; /feeds -> index.html
  location / {
    try_files $uri/index.html $uri $uri.html =404;
  }

  location ~* \.(css|woff2|svg|png|jpg|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
  }

  error_page 404 /404.html;
  location = /404.html { internal; }

  add_header X-Content-Type-Options nosniff always;
}
